server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the gateway so the UI doesn't need to know
    # the gateway's address — everything goes through /api/*
    location /api/ {
        proxy_pass http://api-gateway:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # For any route that isn't a real file, serve index.html.
    # This is what makes Angular's router work on page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
